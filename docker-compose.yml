services:
  llm-practice:
    image: nvcr.io/nvidia/pytorch:25.03-py3
    container_name: llm-practice
    volumes:
      - .:/workspace
    working_dir: /workspace
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true # Equivalent to -i
    tty: true # Equivalent to -t
    command: /bin/bash
